<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="../static/css/reset.css">
        <link rel="stylesheet" href="../static/css/style.css">

        <title>思い出記録</title>
    </head>

    <body>

        <div class="title">
            <h1>思い出</h1>
        </div>

        <a href="/add">
            新しい思い出の記録
        </a>

        <hr>

        {% if posts %}

            <!-- 一覧表 -->
            <table class="memory-table">

                <!-- 見出し -->
                <thead>
                    <tr>
                        <th>写真</th>
                        <th>タイトル</th>
                        <th>場所</th>
                        <th>メモ</th>
                        <th>修正</th>
                    </tr>
                </thead>

                <!-- 登録データ -->
                <tbody>

                    {% for post in posts %}

                        <tr>

                            <!-- 写真 -->
                            <td class="memory-photo">

                                {% if post[2] %}

                                    <img
                                        src="{{ url_for('static', filename='uploads/' + post[2]) }}"
                                        alt="{{ post[1] }}"
                                    >

                                {% else %}

                                    写真なし

                                {% endif %}

                            </td>

                            <!-- タイトル -->
                            <td class="memory-title">
                                {{ post[1] }}
                            </td>

                            <!-- 場所 -->
                            <td class="memory-location">
                                {{ post[3] }}
                            </td>

                            <!-- メモ -->
                            <td class="memory-memo">
                                {{ post[4] }}
                            </td>

                            <!-- 編集 -->
                            <td class="memory-action">

                                <a
                                    href="/edit/{{ post[0] }}"
                                    class="edit-button"
                                >
                                    編集
                                </a>

                                <a
                                    href="/delete/{{ post[0] }}"
                                    class="delete-button"
                                    onclick="return confirm('この思い出を削除しますか？');"
                                >
                                    削除
                                </a>

                            </td>

                        </tr>

                    {% endfor %}

                </tbody>

            </table>

        {% else %}

            <p>
                まだ登録されていません。
            </p>

        {% endif %}

    </body>

</html>
